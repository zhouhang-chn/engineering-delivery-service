[project]
name = "engineering-delivery-service"
version = "0.1.0"
description = "Autonomous engineering delivery service: A2A work order in, deployed FastAPI /docs out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "a2a-sdk>=0.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "docker>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker and not codex and not llm'"
markers = [
    "docker: requires a running Docker daemon (run explicitly with -m docker)",
    "codex: requires the codex CLI with auth quota (run explicitly with -m codex)",
    "llm: requires real LLM credentials, e.g. GOOGLE_API_KEY (run explicitly with -m llm)",
]
